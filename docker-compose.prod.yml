services:
  app:
    image: ${DOCKER_IMAGE}
    container_name: persis_app
    restart: always
    env_file:
      - .env
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      minio-setup:
        condition: service_completed_successfully
    networks:
      - prod_network
    deploy:
      resources:
        limits:
          memory: 1500M

  postgres:
    image: postgres:15-alpine
    container_name: persis_postgres
    restart: always
    env_file:
      - .env
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - prod_network
    deploy:
      resources:
        limits:
          memory: 1000M

  minio:
    image: quay.io/minio/minio:latest
    container_name: persis_minio
    restart: always
    env_file:
      - .env
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    volumes:
      - minio_data:/data
    networks:
      - prod_network
    deploy:
      resources:
        limits:
          memory: 800M

  minio-setup:
    image: quay.io/minio/mc:latest
    container_name: persis_minio_setup
    depends_on:
      - minio
    env_file:
      - .env
    entrypoint: >
      /bin/sh -c "
      until (/usr/bin/mc alias set myminio http://minio:9000 $$S3_ACCESS_KEY $$S3_SECRET_KEY); do
        echo 'Waiting for MinIO...';
        sleep 2;
      done;
      /usr/bin/mc mb myminio/$$S3_BUCKET --ignore-existing;
      /usr/bin/mc anonymous set download myminio/$$S3_BUCKET;
      echo 'MinIO setup ready';
      exit 0;
      "
    networks:
      - prod_network

volumes:
  pg_data:
  minio_data:

networks:
  prod_network:
    driver: bridge
